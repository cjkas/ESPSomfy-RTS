; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32devdbg
src_dir = src

; Shared by every firmware env (they extend it).  Kept out of [env] so the
; native test env doesn't inherit the Arduino framework and ESP32 libraries.
[esp32]
platform =  espressif32 @ 6.13.0
framework = arduino
; Unit tests only run on the PC: pio test -e native
test_ignore = *
lib_deps = 
	bblanchon/ArduinoJson@^7.2.2
	lsatan/SmartRC-CC1101-Driver-Lib@^2.5.7
	knolleary/PubSubClient@^2.8
	esp32async/ESPAsyncWebServer@^3.10.3
	esp32async/AsyncTCP@^3.4.10
extra_scripts = 
	pre:app_version.py
	pre:minify.py
	post:archive_elf.py
board_build.filesystem = littlefs
build_flags = 
	-DCORE_DEBUG_LEVEL=3
	-DCONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=1
	-DCONFIG_ESP_COREDUMP_DATA_FORMAT_ELF=1
	-DCONFIG_ESP_COREDUMP_CHECKSUM_CRC32=1
	-DCONFIG_ESP_TASK_WDT_PANIC=1
	-DCONFIG_ESP_COREDUMP_DECODE_INFO=1
	; Route log_printfv through src/LogLock.cpp so lines from both cores don't
	; interleave.  The core already wraps log_printf for ESP Insights.
	-Wl,--wrap=log_printfv
monitor_speed = 115200
monitor_filters = 
	time
	esp32_exception_decoder
	log2file

; Dual-core targets: keep the async web/socket task on core 0 so the radio
; task on core 1 (with loop()) never competes with network handling.
[dualcore]
build_flags =
	${esp32.build_flags}
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=0

[env:esp32dev]
extends = esp32
board = esp32dev
board_build.partitions = esp32_3MB.csv
build_flags = ${dualcore.build_flags}

[env:esp32devdbg]
extends = esp32
board = esp32dev
build_type = debug
; One 3 MB app slot and no OTA: the debug build is never shipped and outgrew
; the 1.5 MB OTA slot.  Release envs keep esp32_3MB.csv.  NVS stays at 0x9000
; but the file system shrinks, so moving a board to this table means: take a
; backup, flash over USB with -t upload -t uploadfs, then restore the backup.
board_build.partitions = esp32_huge_app.csv
; -Og only limits inlining in units over large-unit-insns (10000 by default).
; Smaller files inline ArduinoJson's helpers into every caller, which costs
; KBs of flash per file, so treat every file as large.
build_flags =
	${dualcore.build_flags}
	--param=large-unit-insns=1000

[env:esp32c3]
extends = esp32
board = esp32-c3-devkitm-1
board_build.partitions = esp32_3MB.csv

[env:esp32s3]
extends = esp32
board = esp32-s3-devkitc-1
build_flags = ${dualcore.build_flags}

[env:esp32c6]
extends = esp32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
build_type = debug
board_build.partitions = esp32_huge_app.csv
build_flags =
	${esp32.build_flags}
	-DCONFIG_FREERTOS_HZ=1000
	-include "driver/gpio.h"
lib_deps = 
	; Low-Level libs, frameowrks and drivers
	ESP32Async/AsyncTCP
	https://github.com/Viproz/SmartRC-CC1101-Driver-Lib.git
	; Commmunication Protocol
	links2004/WebSockets
	https://github.com/hmueller01/pubsubclient3.git
	; Data-Parsing
	bblanchon/ArduinoJson
	; High-level wrappers/servers
	ESP32Async/ESPAsyncWebServer

; Host-side unit tests: pio test -e native  (needs gcc/g++ on PATH).
; Only the sources the tests cover are built; test/stubs stands in for Arduino.h.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<Utils.cpp> +<SomfyFrame.cpp> +<JsonFormatter.cpp> +<ShadeMotion.cpp> +<ShadeSensors.cpp> +<PulseDecoder.cpp> +<TxBuffer.cpp> +<RadioScheduler.cpp> +<ShadeRequests.cpp> +<entryPoints/MqttCommands.cpp> +<ModelSnapshot.cpp> +<ModelEditor.cpp>
build_flags =
	-std=gnu++17
	-Isrc
	-Itest/stubs
	-D_POSIX_THREAD_SAFE_FUNCTIONS
